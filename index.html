<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de Treinamentos Ministrados</title>
<style>
:root{
  --navy:#244061; --beige:#DDD9C3; --title:#1F497D; --line:#4F81BD;
  --bg:#d9dde3; --ink:#000; --hover:#cfe0f5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --bg:#1d2127; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1d2127; } }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif; color:#000; -webkit-text-size-adjust:100%; }

/* ---------- barra de ferramentas (não imprime) ---------- */
.bar-top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:var(--navy); color:#fff; display:flex; gap:10px; align-items:center; padding:8px 12px; flex-wrap:wrap; box-shadow:0 2px 8px rgba(0,0,0,.25); font:14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
.bar-top .t{ font-weight:600; flex:1 1 220px; min-width:160px; }
.bar-top .t small{ display:block; font-weight:400; opacity:.8; font-size:12px; margin-top:2px; }
.bar-top button{ font:inherit; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; background:#fff; color:var(--navy); font-weight:600; }
.bar-top button.pri{ background:#f2c14e; color:#1b2a3d; }
.bar-top button.warn{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); font-weight:500; }
.bar-top button.warn.arm{ background:#b3261e; border-color:#b3261e; }
.bar-top button:disabled{ opacity:.6; cursor:default; }
@media (max-width:640px){ .bar-top{ padding:6px 8px; gap:6px; } .bar-top .t{ flex:1 1 100%; min-width:0; font-size:13px; } .bar-top .t small{ display:none; } .bar-top button{ padding:7px 10px; font-size:13px; } }
#msg{ font-size:12.5px; opacity:.95; min-height:1em; flex-basis:100%; }


/* botão + (duplicar páginas) */
.noprint{ }
.plus{ position:absolute; top:calc(6px / var(--z,1)); right:calc(6px / var(--z,1)); width:calc(30px / var(--z,1)); height:calc(30px / var(--z,1)); border-radius:50%; border:0; background:var(--navy); color:#fff; font:700 calc(22px / var(--z,1))/1 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; cursor:pointer; z-index:6; box-shadow:0 1px 4px rgba(0,0,0,.35); padding:0; display:flex; align-items:center; justify-content:center; }
.plus:hover{ background:#2f5481; }
.badge{ position:absolute; top:calc(11px / var(--z,1)); right:calc(44px / var(--z,1)); font:600 calc(12px / var(--z,1))/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color:var(--navy); background:#f2c14e; border-radius:calc(10px / var(--z,1)); padding:calc(3px / var(--z,1)) calc(9px / var(--z,1)); z-index:6; }
.pmenu{ position:absolute; top:calc(42px / var(--z,1)); right:calc(6px / var(--z,1)); width:calc(260px / var(--z,1)); background:#fff; color:#1b2a3d; border:1px solid #9fb0c6; border-radius:calc(10px / var(--z,1)); box-shadow:0 6px 22px rgba(0,0,0,.35); z-index:8; padding:calc(6px / var(--z,1)); font:calc(14px / var(--z,1))/1.3 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
.pmenu[hidden]{ display:none; }
.pmenu .pm-t{ font-size:calc(12px / var(--z,1)); color:#5a6b80; padding:calc(4px / var(--z,1)) calc(8px / var(--z,1)) calc(6px / var(--z,1)); }
.pmenu button{ display:block; width:100%; text-align:left; border:0; background:transparent; color:inherit; font:inherit; padding:calc(9px / var(--z,1)) calc(8px / var(--z,1)); border-radius:calc(7px / var(--z,1)); cursor:pointer; }
.pmenu button:hover{ background:#e7eef8; }
.pmenu button.del{ color:#b3261e; border-top:1px solid #e3e8ef; border-radius:0 0 calc(7px / var(--z,1)) calc(7px / var(--z,1)); margin-top:calc(4px / var(--z,1)); }
.pmenu button.del.arm{ background:#b3261e; color:#fff; }

/* ---------- folhas A4 ---------- */
#pages{ padding:14px 0 40px; zoom:var(--z,1); overflow-x:hidden; touch-action:manipulation; }
.sheet{ position:relative; width:595.3pt; height:841.9pt; margin:0 auto 14px; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.35); overflow:hidden; color:#000; }
.hdr{ position:absolute; left:36pt; top:14.15pt; width:535pt; display:flex; }
.hdr .lg{ width:113.75pt; padding:2.9pt 5.75pt; border-right:2.25pt solid var(--line); }
.hdr .lg img{ display:block; width:100pt; height:50.9pt; }
.hdr .tt{ padding:2.9pt 5.75pt 2.9pt 8pt; font-size:24pt; line-height:29.3pt; color:var(--title); white-space:nowrap; }
.pn{ position:absolute; right:36pt; bottom:14.15pt; font-size:10pt; color:var(--title); }

.bar{ position:absolute; left:36pt; width:530pt; height:31pt; background:var(--navy); color:#fff; font-weight:700; font-size:14pt; text-align:center; line-height:31pt; }
.bar u{ text-underline-offset:1.5pt; }

/* página 1 */
.intro{ position:absolute; left:36pt; top:85pt; width:530pt; font-size:12pt; font-style:italic; line-height:14.65pt; border-bottom:.5pt solid #000; padding-bottom:.5pt; }
.intro p{ margin:0; text-indent:35.4pt; }
.intro a{ color:#0000ff; }
.cli{ position:absolute; left:36pt; width:530pt; top:233.5pt; border:.5pt solid #000; border-bottom:.5pt solid #000; }
.cli .pair{ border-bottom:.5pt solid #000; }
.cli .pair:last-child{ border-bottom:0; }
.cli .lab{ background:var(--navy); color:#fff; font-weight:700; font-size:8pt; line-height:9.8pt; padding:.3pt 2.5pt; white-space:nowrap; overflow:hidden; border-right:1.5pt solid #000; border-bottom:1.5pt solid #000; }
.cli .val{ height:15pt; }
.cli .val input{ width:100%; height:100%; border:0; outline:0; background:transparent; font:12pt Calibri,Carlito,"Segoe UI",Arial,sans-serif; padding:0 5.4pt; color:#000; }
.cli .val input:focus,.sig input:focus,.ex:focus{ background:var(--hover); }
.trn{ position:absolute; left:35.5pt; width:530.5pt; top:488.5pt; border:.5pt solid #000; border-top:0; }
.trn .h{ display:flex; height:12.5pt; }
.trn .h .a{ background:var(--navy); color:#fff; font-weight:700; font-size:8pt; line-height:11pt; padding:0 5.4pt; width:47pt; border-right:1.5pt solid #000; border-bottom:1.5pt solid #000; }
.trn .h .sp{ flex:1; }
.trn .h .b{ width:56pt; margin-left:0; background:var(--navy); color:#fff; font-weight:700; font-size:8pt; line-height:11pt; padding:0 5.4pt; margin-right:36pt; border-right:1.5pt solid #000; border-bottom:1.5pt solid #000; }
.trn .r{ display:flex; height:14.6pt; }
.trn .r.be{ background:var(--beige); }
.trn .r .tx{ flex:0 0 437.5pt; position:relative; padding-left:43.5pt; font-size:12pt; line-height:14.6pt; border-right:.5pt solid #000; white-space:nowrap; overflow:hidden; }
.trn .r .tx .no{ position:absolute; left:25pt; }
.trn .r .tx i{ font-size:10pt; }
.trn .r .c{ font-size:12pt; line-height:14.6pt; padding-left:5.4pt; cursor:pointer; user-select:none; }
.trn .r .c1{ flex:0 0 44pt; border-right:.5pt solid #000; }
.trn .r .c2{ flex:1; }
.trn .r .c:hover{ background:var(--hover); }
.trn .r.last{ height:15pt; border-top:0; }

/* tabelas de rotinas */
.tb{ position:absolute; left:35.5pt; top:85pt; }
table.g{ border-collapse:collapse; table-layout:fixed; width:530pt; font-size:9pt; }
table.g td{ padding:0; border-left:.5pt solid #000; border-right:.5pt solid #000; border-top:0; border-bottom:0; height:14.65pt; overflow:hidden; }
table.g tr.ttl td{ background:var(--navy); color:#fff; height:31.7pt; text-align:center; font-weight:700; font-size:14pt; border:.5pt solid #000; }
table.g tr.ttl .no{ margin-right:2pt; }
table.g tr.hd td{ border-bottom:.5pt solid #000; padding:0; vertical-align:top; }
table.g td.nmc{ position:relative; }
.nm{ display:block; height:100%; width:22.4pt; writing-mode:vertical-rl; transform:rotate(180deg); font-size:9pt; line-height:11pt; white-space:normal; overflow-wrap:anywhere; overflow:hidden; outline:0; cursor:text; text-align:start; padding:5.4pt 0; }
.nm:focus{ background:var(--hover); }
.nm[data-ph]:empty::before{ content:attr(data-ph); color:#9aa5b4; font-style:italic; }
td.dg{ position:relative; }
td.dg svg{ position:absolute; inset:0; width:100%; height:100%; }
td.dg .u1,td.dg .u2{ position:absolute; font-weight:700; font-size:14pt; line-height:17pt; }
td.dg .u1{ left:27.65pt; top:20.8pt; } td.dg .u2{ left:111.75pt; top:50.3pt; }
table.g td.lb{ padding:0 5.4pt; line-height:12pt; font-size:9pt; vertical-align:middle; }
table.g td.lb.b{ font-weight:700; }
table.g tr.be td{ background:var(--beige); }
table.g td.m{ text-align:center; font-size:12pt; line-height:14.5pt; cursor:pointer; user-select:none; -webkit-user-select:none; }
table.g td.m:hover{ background:var(--hover); }
table.g tr.endrow td{ border-bottom:.5pt solid #000; }
.ex{ width:100%; border:0; outline:0; background:transparent; font:9pt Calibri,Carlito,"Segoe UI",Arial,sans-serif; padding:0; height:13pt; }

/* assinaturas */
.sigt{ position:absolute; left:35.5pt; top:85pt; width:531.2pt; }
table.sg{ border-collapse:collapse; table-layout:fixed; width:531.15pt; font-size:9pt; }
table.sg td{ padding:0; border-left:.5pt solid #000; border-right:.5pt solid #000; height:14.65pt; overflow:hidden; }
table.sg tr.shd td{ height:11.35pt; border-top:0; border-bottom:0; border-left:0; border-right:0; vertical-align:top; }
table.sg tr.shd td.lab{ background:var(--navy); color:#fff; font-weight:700; font-size:8pt; line-height:9.8pt; padding:0 5.4pt; border:0; border-right:1.5pt solid #000; border-bottom:1.5pt solid #000; white-space:nowrap; overflow:visible; }
table.sg tr.be td{ background:var(--beige); }
table.sg tr.endrow td{ border-bottom:.5pt solid #000; }
.sig{ width:100%; height:100%; border:0; outline:0; background:transparent; font:9pt Calibri,Carlito,"Segoe UI",Arial,sans-serif; padding:0 5.4pt; color:#000; }

@media print{
  .noprint{ display:none !important; }
  @page{ size:A4; margin:0; }
  body{ background:#fff; }
  .bar-top{ display:none; }
  #pages{ padding:0; zoom:1 !important; }
  .sheet{ margin:0; box-shadow:none; page-break-after:always; break-after:page; }
  .nm[data-ph]:empty::before{ content:''; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<div class="bar-top" id="top">
  <div class="t">Checklist de Treinamentos Ministrados<small>Clique nos quadradinhos (ou arraste). Os nomes das colunas se repetem em todas as folhas. Use o + de cada página para duplicar.</small></div>
  <button id="bLogin" class="warn" type="button" style="display:none">Entrar (salvar na nuvem)</button>
  <button id="bClear" class="warn" type="button">Limpar tudo</button>
  <button id="bExport" class="pri" type="button">Exportar Word (.docx)</button>
  <button id="bPdf" class="pri" type="button">Exportar PDF</button>
  <div id="msg" role="status" aria-live="polite"></div>
</div>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

var SECS = [];
(function(){

  TPL.tables.forEach(function(tb, ti){
    tb.rows.forEach(function(r){
      if(r[0]==="t"){ sec++; SECS.push({title:r[2], titleXml:r[1], tbl:ti, pages:[]}); }
      else if(r[0]==="h"){ SECS[sec].pages.push({h:r[1], rows:[]}); }
      else { var p = SECS[sec].pages[SECS[sec].pages.length-1]; p.rows.push({sg:r[1], label:r[2], bold:r[3], beige:r[4]}); }
    });
  });

function defaultPages(){
  var a = [];
  SECS.forEach(function(sec,si){ sec.pages.forEach(function(p,pi){ a.push({id:si+"."+pi, si:si, pi:pi, g:0}); }); });
  return a;
}

function fresh(){
  return { v:3, c:["","","",""], y:[0,0,0,0,0,0], n:new Array(NC).fill(""), gn:{}, ord:[], m:{}, x:{}, dep:{}, by:{}, en:{}, pg:null, uid:0 };
}
function migrate(o){
  if(!o.v){
    var d={}, b={}, e={};
    Object.keys(o.dep||{}).forEach(function(k){ var i=+k; d[i<NC?"c"+i:"e"+(i-NC)] = o.dep[k]; });
    Object.keys(o.by||{}).forEach(function(k){ var i=+k; b[i<NC?"c"+i:"e"+(i-NC)] = o.by[k]; });
    Object.keys(o.en||{}).forEach(function(k){ var i=+k; if(i>=NC) e["e"+(i-NC)] = o.en[k]; });
    o.dep=d; o.by=b; o.en=e; o.v=2;
  }
  if(o.v<3){
    o.gn={}; o.ord=[]; o.pg=null; o.uid=0; o.v=3;
    for(var c=0;c<NC;c++) if(String(o.n[c]||"").trim()) o.ord.push("0."+c);
  }
  return o;
}
var S = fresh();
try{
  var raw = localStorage.getItem(STORE);
  if(raw){ var o = JSON.parse(raw); if(o && o.n && o.c){ S = Object.assign(fresh(), migrate(o)); } }
}catch(e){}
function ensurePages(){
  var ok = Array.isArray(S.pg) && S.pg.length && S.pg.every(function(p){ return p && SECS[p.si] && SECS[p.si].pages[p.pi] && typeof p.id==="string" && typeof p.g==="number"; });
  if(!ok) S.pg = defaultPages();
  if(!Array.isArray(S.ord)) S.ord = [];
  if(!S.gn || typeof S.gn!=="object") S.gn = {};
}
ensurePages();

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function names(g){ if(g===0) return S.n; if(!S.gn[g]) S.gn[g] = new Array(NC).fill(""); return S.gn[g]; }
function groupAlive(g){ return S.pg.some(function(p){ return p.g===g; }); }
function dkey(g,c){ return g===0 ? "c"+c : "c"+g+"_"+c; }

/* Lista de assinaturas: nomes preenchidos na ORDEM EM QUE FORAM DIGITADOS (1º nome na 1ª linha, 2º na 2ª...).
   Depois deles ficam linhas livres (extras). A lista cresce em mais folhas se passar de 43 pessoas. */
function sigCount(n){ return Math.max(1, Math.ceil(n/SIG1)) * SIG1; }
function sigModel(){
  var ents = [], seen = {};
  function add(g,c){
    var k = g+"."+c; if(seen[k]) return; seen[k] = 1;
    if(!groupAlive(g) || !String(names(g)[c]||"").trim()) return;
    ents.push({key:dkey(g,c), g:g, col:c, name:names(g)[c]});
  }
  S.ord.forEach(function(k){ var p = k.split("."); add(+p[0], +p[1]); });
  var gs = {}; S.pg.forEach(function(p){ gs[p.g] = 1; });
  Object.keys(gs).map(Number).sort(function(a,b){return a-b;}).forEach(function(g){ for(var c=0;c<NC;c++) add(g,c); });
  var total = sigCount(ents.length), rows = ents.slice();
  for(var j=0; rows.length<total; j++) rows.push({key:"e"+j, g:-1, col:-1, name:S.en["e"+j]||""});
  return rows;
}

    rows += '<td class="nmc" style="height:'+hh+'pt"><div class="nm" contenteditable="true" spellcheck="false" role="textbox" aria-label="Nome do usuário '+(c+1)+'" data-g="'+g+'" data-c="'+c+'"'+ph+' title="'+esc(nm[c])+'">'+esc(nm[c])+'</div></td>';
  }
  rows += '<td class="dg" style="height:'+hh+'pt"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="100" y1="0" x2="0" y2="100" stroke="#000" stroke-width=".6" vector-effect="non-scaling-stroke"/></svg><span class="u1">Usuários</span><span class="u2">Rotinas</span></td></tr>';
  pg.rows.forEach(function(r,ri){
    var key = inst.id+"."+ri, bits = S.m[key]||0;
    var cls = (r.beige?'be':'') + (ri===pg.rows.length-1?' endrow':'');
    rows += '<tr class="'+cls+'" data-k="'+key+'">';
    for(var c2=0;c2<NC;c2++) rows += '<td class="m" data-c="'+c2+'">'+((bits>>c2)&1?'X':'')+'</td>';
    if(r.label) rows += '<td class="lb'+(r.bold?' b':'')+'">'+esc(r.label)+'</td></tr>';
    else rows += '<td class="lb"><input class="ex" type="text" data-x="'+key+'" value="'+esc(S.x[key]||"")+'" aria-label="Descrição da rotina extra" autocomplete="off"></td></tr>';
  });
  return sheet('<div class="tb"><table class="g">'+colgroup()+rows+'</table></div>', {plus:idx, g:g});
}
var sigRendered = 0;
function sigRow(r,i,last,loc){
  return '<tr class="'+(loc%2===1?'be':'')+(last?' endrow':'')+'"><td colspan="2"><input class="sig" data-si="'+i+'" data-g="'+r.g+'" data-c="'+r.col+'" data-k="'+r.key+'" type="text" value="'+esc(r.name)+'" aria-label="Usuário '+(i+1)+'" autocomplete="off"></td>'
     + '<td colspan="3"><input class="sig" data-sd="'+i+'" data-k="'+r.key+'" type="text" value="'+esc(S.dep[r.key]||"")+'" aria-label="Departamento '+(i+1)+'" autocomplete="off"></td>'
     + '<td colspan="2"><input class="sig" data-sb="'+i+'" data-k="'+r.key+'" type="text" value="'+esc(S.by[r.key]||"")+'" aria-label="Treinamento por '+(i+1)+'" autocomplete="off"></td>'
     + '<td colspan="2"></td></tr>';
}
var SGCOLS = '<colgroup><col style="width:47.95pt"><col style="width:97.65pt"><col style="width:.35pt"><col style="width:65.2pt"><col style="width:63.6pt"><col style="width:70.85pt"><col style="width:42.55pt"><col style="width:70.85pt"><col style="width:72.15pt"></colgroup>';
/* cada folha de assinatura é uma cópia completa da última página (título + cabeçalho + 43 linhas) */
function sigSheets(){
  var M = sigModel(), total = M.length, out = "";
  sigRendered = total;
  for(var st=0; st<total; st+=SIG1){
    var end = Math.min(st+SIG1, total);
    var h = '<div class="sigt"><table class="g" style="margin-bottom:0"><tr class="ttl"><td colspan="16" style="border:.5pt solid #000"><u>COLETA DE ASSINATURAS DOS PARTICIPANTES DO TREINAMENTO</u></td></tr></table>';
    h += '<table class="sg">'+SGCOLS+'<tr class="shd"><td class="lab" style="text-align:right">Usuários:</td><td></td><td class="lab" colspan="2" style="text-align:left">Departamento:</td><td></td><td class="lab" style="text-align:left">Treinamento por:</td><td></td><td class="lab" style="text-align:left">Assinatura:</td><td></td></tr>';
    for(var j=st;j<end;j++) h += sigRow(M[j], j, j===end-1, j-st);
    h += '</table></div>';
    out += sheet(h, {cls:"sigsheet"});
  }
  return out;
}
/* mantém só a(s) folha(s) de assinatura em sincronia sem recriar o resto (não perde o foco) */
function refreshSig(){
  var M = sigModel();
  if(M.length!==sigRendered){
    var old = pagesEl.querySelectorAll(".sigsheet");
    for(var k=0;k<old.length;k++) old[k].parentNode.removeChild(old[k]);
    pageNo = pagesEl.querySelectorAll(".sheet").length;
    pagesEl.insertAdjacentHTML("beforeend", sigSheets());
    return;
  }
  for(var i=0;i<M.length;i++){
    var a = pagesEl.querySelector('input[data-si="'+i+'"]'); if(!a) return;
    var b = pagesEl.querySelector('input[data-sd="'+i+'"]'), c = pagesEl.querySelector('input[data-sb="'+i+'"]');
    var vn = M[i].name, vd = S.dep[M[i].key]||"", vb = S.by[M[i].key]||"";
    if(a.value!==vn) a.value = vn; if(b.value!==vd) b.value = vd; if(c.value!==vb) c.value = vb;
    a.setAttribute("data-g",M[i].g); a.setAttribute("data-c",M[i].col); a.setAttribute("data-k",M[i].key);
    b.setAttribute("data-k",M[i].key); c.setAttribute("data-k",M[i].key);
  }
}
function renderAll(){
  pageNo = 0;
  var h = page1();
  S.pg.forEach(function(inst,idx){ h += secPage(inst, idx); });
  h += sigSheets();
  document.getElementById("pages").innerHTML = h;
}
renderAll();

var pagesEl = document.getElementById("pages");
function toggleCell(td, val){
  var tr = td.parentNode, key = tr.getAttribute("data-k"), c = +td.getAttribute("data-c");
  var bits = S.m[key]||0, on = (bits>>c)&1;
  var want = (val===undefined) ? !on : val;
  if(!!on === !!want) return want;
  bits = want ? (bits | (1<<c)) : (bits & ~(1<<c));
  if(bits) S.m[key] = bits; else delete S.m[key];
  td.textContent = want ? "X" : "";
  save();
  return want;
}
var drag = null, skipClick = false;
pagesEl.addEventListener("pointerdown", function(e){
  var td = e.target.closest && e.target.closest("td.m");
  if(!td || e.pointerType!=="mouse" || e.button!==0) return;
  drag = toggleCell(td); skipClick = true; e.preventDefault();
});
pagesEl.addEventListener("pointerover", function(e){
  if(drag===null) return;
  var td = e.target.closest && e.target.closest("td.m");
  if(td) toggleCell(td, drag);
});
window.addEventListener("pointerup", function(){ drag = null; });
window.addEventListener("pointercancel", function(){ drag = null; });
pagesEl.addEventListener("click", function(e){
  var td = e.target.closest && e.target.closest("td.m");

});

function cleanName(t){ return String(t).replace(/[\r\n\t]+/g," ").slice(0,25); }
function setName(g, c, v, except){
  var arr = names(g), k = g+"."+c;
  arr[c] = v;
  var has = !!String(v).trim(), pos = S.ord.indexOf(k);
  if(has && pos<0) S.ord.push(k);                                  // entra na lista na ordem em que foi digitado
  else if(!has && pos>=0) S.ord.splice(pos,1);                     // nome apagado: sai da lista (se digitar de novo, vai pro fim)
  var els = pagesEl.querySelectorAll('.nm[data-g="'+g+'"][data-c="'+c+'"]');
  for(var i=0;i<els.length;i++){ if(els[i]!==except){ els[i].textContent = v; } els[i].title = v; }
  save();
}
function dropIfEmpty(g, c){
  if(g<0 || c<0) return;
  if(String(names(g)[c]||"").trim()) return;
  var i = S.ord.indexOf(g+"."+c);
  if(i>=0){ S.ord.splice(i,1); save(); }
  refreshSig();
}
pagesEl.addEventListener("input", function(e){
  var t = e.target;
  if(t.classList.contains("nm")){
    var g = +t.getAttribute("data-g"), c = +t.getAttribute("data-c"), v = cleanName(t.textContent);
    if(v !== t.textContent){
      t.textContent = v;
      var r = document.createRange(); r.selectNodeContents(t); r.collapse(false);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    setName(g, c, v, t); refreshSig();
  } else if(t.hasAttribute("data-cli")){
    S.c[+t.getAttribute("data-cli")] = t.value; save();
  } else if(t.hasAttribute("data-x")){
    S.x[t.getAttribute("data-x")] = t.value; save();
  } else if(t.hasAttribute("data-si")){
    var sg = +t.getAttribute("data-g"), sc = +t.getAttribute("data-c");
    if(sg>=0) setName(sg, sc, cleanName(t.value), t); else { S.en[t.getAttribute("data-k")] = t.value; save(); }
  } else if(t.hasAttribute("data-sd")){
    S.dep[t.getAttribute("data-k")] = t.value; save();
  } else if(t.hasAttribute("data-sb")){
    S.by[t.getAttribute("data-k")] = t.value; save();
  }
});
pagesEl.addEventListener("focusout", function(e){
  var t = e.target;
  if(t.classList && t.classList.contains("nm")) dropIfEmpty(+t.getAttribute("data-g"), +t.getAttribute("data-c"));
  else if(t.hasAttribute && t.hasAttribute("data-si")){ dropIfEmpty(+t.getAttribute("data-g"), +t.getAttribute("data-c")); refreshSig(); }
});

/* ====================== botão "+" (duplicar páginas) ====================== */
function closeMenus(){
  var m = pagesEl.querySelectorAll(".pmenu:not([hidden])");
  for(var i=0;i<m.length;i++){ m[i].hidden = true; var d = m[i].querySelector(".del"); if(d){ d.classList.remove("arm"); d.textContent = "Excluir esta página"; } }
}
function copyExtras(src, ni){
  var pg = SECS[ni.si].pages[ni.pi];
  pg.rows.forEach(function(r,ri){ if(!r.label){ var v = S.x[src.id+"."+ri]; if(v) S.x[ni.id+"."+ri] = v; } });
}
function insertAfterSiblings(ni){            // coloca a cópia logo depois da última página igual a ela
  var last = -1;
  S.pg.forEach(function(p,k){ if(p.si===ni.si && p.pi===ni.pi) last = k; });
  S.pg.splice(last+1, 0, ni);
}
function dupOne(i){
  var src = S.pg[i], g = src.g+1;
  while(S.pg.some(function(p){ return p.si===src.si && p.pi===src.pi && p.g===g; })) g++;
  var ni = {id:"d"+(++S.uid), si:src.si, pi:src.pi, g:g};
  copyExtras(src, ni); names(g);
  insertAfterSiblings(ni);
  save(); renderAll(); goToPage(S.pg.indexOf(ni));
  say("Página duplicada: colunas do Conjunto "+(g+1)+" (mais "+NC+" usuários). Os nomes digitados nele se repetem nas páginas desse conjunto.");
}
function dupAll(i){
  var g = 1; S.pg.forEach(function(p){ if(p.g>=g) g = p.g+1; });
  names(g);
  var clicked = S.pg[i], focus = null;
  SECS.forEach(function(sec,si){ sec.pages.forEach(function(pg,pi){
    var src = S.pg.filter(function(p){ return p.si===si && p.pi===pi; })[0] || {id:"-"};
    var ni = {id:"d"+(++S.uid), si:si, pi:pi, g:g};
    copyExtras(src, ni); insertAfterSiblings(ni);
    if(clicked && clicked.si===si && clicked.pi===pi) focus = ni;
  }); });
  save(); renderAll(); goToPage(focus ? S.pg.indexOf(focus) : 0);
  say("Todas as páginas duplicadas (Conjunto "+(g+1)+", mais "+NC+" usuários): cada cópia fica logo depois da original. Os nomes digitados nele se repetem em todas as cópias.");
}
function removeInst(i){
  var inst = S.pg[i]; if(!inst || inst.g===0) return;
  var pre = inst.id+".";
  Object.keys(S.m).forEach(function(k){ if(k.indexOf(pre)===0) delete S.m[k]; });
  Object.keys(S.x).forEach(function(k){ if(k.indexOf(pre)===0) delete S.x[k]; });
  S.pg.splice(i,1);
  if(!groupAlive(inst.g)){
    delete S.gn[inst.g];
    S.ord = S.ord.filter(function(k){ return +k.split(".")[0]!==inst.g; });
  }
  save(); renderAll();
  say("Página excluída.");
}
function goToPage(idx){
  var sheets = pagesEl.querySelectorAll(".sheet"), el = sheets[idx+1];    // +1: a página 1 não é de rotinas
  if(el && el.scrollIntoView) el.scrollIntoView({block:"start"});
}
pagesEl.addEventListener("click", function(e){
  var pl = e.target.closest && e.target.closest(".plus");
  if(pl){
    var menu = pl.parentNode.querySelector(".pmenu"), wasHidden = menu.hidden;
    closeMenus(); menu.hidden = !wasHidden; return;
  }
  var act = e.target.closest && e.target.closest("[data-act]");
  if(act){
    var i = +act.getAttribute("data-i"), a = act.getAttribute("data-act");
    if(a==="del"){
      if(!act.classList.contains("arm")){ act.classList.add("arm"); act.textContent = "Confirmar: excluir esta página"; return; }
      closeMenus(); removeInst(i); return;
    }
    closeMenus(); if(a==="one") dupOne(i); else if(a==="all") dupAll(i);
  }
});
document.addEventListener("click", function(e){
  if(!(e.target.closest && (e.target.closest(".pmenu") || e.target.closest(".plus")))) closeMenus();
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeMenus(); });
pagesEl.addEventListener("keydown", function(e){

pagesEl.addEventListener("paste", function(e){

/* ====================== exportar .docx ====================== */
var NS_FIX = ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:a14="http://schemas.microsoft.com/office/drawing/2010/main"';
var NARROW_RPR = '<w:rPr><w:rFonts w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:eastAsia="pt-BR"/></w:rPr>';
function lblRpr(b){ return '<w:rPr><w:rFonts w:eastAsia="Times New Roman" w:cs="Times New Roman"/>'+(b?'<w:b/>':'')+'<w:sz w:val="18"/><w:szCs w:val="24"/><w:lang w:eastAsia="pt-BR"/></w:rPr>'; }
function wx(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,""); }
function runOf(rpr, text){ return text ? '<w:r>'+rpr+'<w:t xml:space="preserve">'+wx(text)+'</w:t></w:r>' : ''; }
var TOK = /\{\{([A-Z])(\d+)\}\}/g;
function addKeepNext(x){
  if(x.indexOf('<w:pStyle')>=0) return x.replace(/(<w:pStyle [^>]*\/>)/, '$1<w:keepNext/>');
  return x.replace('<w:pPr>', '<w:pPr><w:keepNext/>');
}
var PGBRK = '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr><w:r><w:rPr><w:sz w:val="2"/></w:rPr><w:br w:type="page"/></w:r></w:p>';
function titleFor(si){                       // título da seção com número fixo (a numeração automática contaria as cópias)
  var x = SECS[si].titleXml.replace(/<w:numPr>.*?<\/w:numPr>/, '<w:ind w:left="0" w:firstLine="0"/>');
  var num = '<w:r><w:rPr><w:rFonts w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:b/><w:sz w:val="28"/><w:szCs w:val="24"/><w:lang w:eastAsia="pt-BR"/></w:rPr><w:t xml:space="preserve">'+(si+1)+'.\u2002\u2002</w:t></w:r>';
  var i = x.indexOf("<w:r>");
  return x.slice(0,i)+num+x.slice(i);
}
function buildDocXml(){
  var idc = 100, out = [];
  function ids(x){ return x.replace(/@ID@/g, function(){ return String(++idc); }); }
  function rowsFor(inst){
    var sec = SECS[inst.si], pg = sec.pages[inst.pi], nm = names(inst.g), x = "";
    if(inst.pi===0) x += addKeepNext(titleFor(inst.si));
    x += ids(TPL.hdrs[pg.h]).replace(TOK, function(m,p,n){ return runOf(TPL.fr.H, nm[+n-1]); });
    pg.rows.forEach(function(r,ri){
      var key = inst.id+"."+ri, bits = S.m[key]||0, ids16 = TPL.sigs[r.sg], cells = "";
      for(var c=0;c<NC;c++){
        cells += '<w:tc>'+TPL.tc[ids16[c]]+'<w:p><w:pPr><w:jc w:val="center"/>'+NARROW_RPR+'</w:pPr>'+((bits>>c)&1 ? runOf(NARROW_RPR,"X") : "")+'</w:p></w:tc>';
      }
      var inner;
      if(r.label) inner = '<w:p><w:r>'+lblRpr(r.bold)+'<w:t xml:space="preserve">'+wx(r.label)+'</w:t></w:r></w:p>';
      else inner = '<w:p>'+(S.x[key] ? runOf(lblRpr(0), S.x[key]) : "")+'</w:p>';
      cells += '<w:tc>'+TPL.tc[ids16[15]]+inner+'</w:tc>';
      x += '<w:tr>'+cells+'</w:tr>';
    });
    return x;
  }
  /* uma tabela por página de rotinas (na ordem atual), separadas por quebra de página: cada página sai igual à da tela */
  var routine = S.pg.map(function(inst){
    var tb = TPL.tables[SECS[inst.si].tbl];
    return '<w:tbl>'+tb.pr+tb.grid+rowsFor(inst)+'</w:tbl>';
  }).join(PGBRK) + PGBRK;

  var sigTitle = "";
  function sigXml(){
    var sg = TPL.sig, M = sigModel(), total = M.length, out2 = "";
    for(var st=0; st<total; st+=SIG1){
      var rows = "";
      for(var i=st;i<Math.min(st+SIG1,total);i++){
        var cellIdx = sg.rows[i-st], vals = [ M[i].name, S.dep[M[i].key]||"", S.by[M[i].key]||"" ], cells = "";
        cellIdx.forEach(function(ci, k){
          cells += sg.cells[ci].replace(TOK, function(){ return runOf(TPL.fr.S, vals[k]); });
        });
        rows += '<w:tr>'+cells+'</w:tr>';
      }
      if(st>0) out2 += PGBRK;
      out2 += sigTitle + '<w:tbl>'+sg.pr+sg.grid+sg.head+rows+'</w:tbl>';
    }
    return out2;
  }
  var firstT = true;
  TPL.seq.forEach(function(it, idx){
    if(it[0]==="x"){
      var x = it[1];
      if(x.indexOf('<w:br w:type="page"/>')>=0 && x.length<200) return;   // quebras entre as tabelas originais: refeitas acima
      x = x.replace(TOK, function(m,p,n){
        if(p==="C") return runOf(TPL.fr.C, S.c[+n-1]);
        if(p==="Y"){ var k = +n-1, row = k>>1, v = (k&1)?2:1; return runOf(TPL.fr.Y, S.y[row]===v ? "X" : "\u2002"); }
        return m;
      });
      if(x.indexOf("COLETA DE ASSINATURAS")>=0){ sigTitle = addKeepNext(x); return; }   // repetido em cada folha de assinaturas
      out.push(x);
    } else if(it[0]==="T"){ if(firstT){ out.push(routine); firstT = false; } }
    else if(it[0]==="S"){ out.push(sigXml()); }
  });
  var root = TPL.rootOpen.replace("<w:document", "<w:document"+NS_FIX);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+root+'<w:body>'+out.join("")+TPL.sect+'</w:body></w:document>';
}
function fileName(){
  var n = (S.c[0]||"").trim().replace(/[\\\/:*?"<>|\u0000-\u001f]+/g," ").replace(/\s+/g," ").trim().slice(0,60).trim();
  return "Checklist_Treinamento" + (n ? "_"+n : "") + ".docx";
}
async function deliver(blob, name, btn){
  var done = false;
  try{
    if(window.claude && window.claude.use){
      var dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename:name, data:blob}); done = true; say("Pronto: "+name); }
    }
  }catch(err){
    if(err && err.code==="declined"){ say("Download cancelado."); return; }
  }
  if(!done){
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    say("Pronto: "+name);
  }
}
function baseName(){
  var n = (S.c[0]||"").trim().replace(/[\\\/:*?"<>|\u0000-\u001f]+/g," ").replace(/\s+/g," ").trim().slice(0,60).trim();
  return "Checklist_Treinamento" + (n ? "_"+n : "");
}
async function exportDocx(){
  var btns = [document.getElementById("bExport"), document.getElementById("bPdf")];
  btns.forEach(function(b){ b.disabled = true; }); say("Gerando o arquivo Word…");
  try{
    if(typeof JSZip==="undefined") throw new Error("Biblioteca de compactação indisponível (sem internet?).");
    var zip = await JSZip.loadAsync(SKEL, {base64:true});
    zip.file("word/document.xml", buildDocXml());
    var blob = await zip.generateAsync({type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    await deliver(blob, baseName()+".docx");
  }catch(err){
    say("Não consegui gerar o arquivo: "+(err && err.message ? err.message : err));
  }
  btns.forEach(function(b){ b.disabled = false; });

    pg.rows.forEach(function(r,ri){ if(r.beige) fill(X0,top0+ri*RW,TW,RW,BEIGE); });
    var bottom = top0 + n*RW;
    for(var k=0;k<=NC+1;k++){ var vx = k<=NC ? X0+k*CW : X0+TW; ln(vx,y,vx,bottom,.5); }
    ln(X0,y+hh,X0+TW,y+hh,.5); ln(X0,bottom,X0+TW,bottom,.5);
    ln(X0+TW,y,X0+NC*CW,y+hh,.5);                      // diagonal
    font("bold",14,"#000000");
    txt("Usuários", X0+NC*CW+27.65, y+20.8+17/2+(ASC-DESC)/2*14);
    txt("Rotinas",  X0+NC*CW+111.75, y+50.3+17/2+(ASC-DESC)/2*14);
    font("normal",9,"#000000");
    for(var c=0;c<NC;c++){
      var lines = wrap(nm[c], hh-10.8);
      lines.forEach(function(L,li){ txt(L, X0+c*CW + 11/2 + li*11 + (ASC-DESC)/2*9, y+hh-5.4, {angle:90}); });
    }
    pg.rows.forEach(function(r,ri){
      var rt = top0+ri*RW, key = inst.id+"."+ri, bits = S.m[key]||0;
      if(bits){ font("normal",12,"#000000"); for(var c2=0;c2<NC;c2++) if((bits>>c2)&1) txt("X", X0+c2*CW+CW/2, bl(rt,RW,12), {align:"center"}); }
      var lab = r.label || S.x[key] || "";
      font(r.label && r.bold ? "bold" : "normal", 9, "#000000");
      txt(lab, X0+NC*CW+5.4, bl(rt,RW,9));
    });
  });

  /* ---- assinaturas: cada folha é uma cópia completa (título + cabeçalho + 43 linhas) ---- */
  var SX = [35.5,181.1,310.25,423.65,566.65], M = sigModel(), total = M.length, SRH = 14.65;
  for(var segStart=0; segStart<total; segStart+=SIG1){
    newPage();
    var segEnd = Math.min(segStart+SIG1, total), y0 = 85;
    fill(35.5,y0,TW,31.7,NAVY);
    font("bold",14,"#ffffff"); var tt = "COLETA DE ASSINATURAS DOS PARTICIPANTES DO TREINAMENTO", tby = bl(y0,31.7,14), ttw = tw(tt);
    txt(tt, 35.5+TW/2-ttw/2, tby); ul(35.5+TW/2-ttw/2, tby, ttw, 14, "#ffffff");
    doc.setDrawColor("#000000"); doc.setLineWidth(.5); doc.rect(35.5,y0,TW,31.7,"S");
    var hy = y0+31.7, HH = 11.35;
    label(35.5,hy,47.95,HH,"Usuários:","right");
    label(35.5+47.95+97.65,hy,65.55,HH,"Departamento:","left");
    label(310.25,hy,70.85,HH,"Treinamento por:","left");
    label(423.65,hy,70.85,HH,"Assinatura:","left");
    var sy = hy+HH, send = sy+(segEnd-segStart)*SRH;
    for(var i3=segStart;i3<segEnd;i3++) if((i3-segStart)%2===1) fill(SX[0],sy+(i3-segStart)*SRH,SX[4]-SX[0],SRH,BEIGE);
    SX.forEach(function(vx){ ln(vx,sy,vx,send,.5); });
    ln(SX[0],send,SX[4],send,.5);
    font("normal",9,"#000000");
    for(var i4=segStart;i4<segEnd;i4++){
      var rt2 = sy+(i4-segStart)*SRH, by2 = bl(rt2,SRH,9), rr = M[i4];
      txt(rr.name, SX[0]+5.4, by2); txt(S.dep[rr.key]||"", SX[1]+5.4, by2); txt(S.by[rr.key]||"", SX[2]+5.4, by2);
    }
  }
  return doc.output("blob");
}
async function exportPdf(){
  var btns = [document.getElementById("bExport"), document.getElementById("bPdf")];
  btns.forEach(function(b){ b.disabled = true; }); say("Gerando o PDF…");
  try{
    await new Promise(function(r){ setTimeout(r,30); });      // deixa a mensagem aparecer
    var blob = buildPdf();
    await deliver(blob, baseName()+".pdf");
  }catch(err){
    say("Não consegui gerar o PDF: "+(err && err.message ? err.message : err));
  }
  btns.forEach(function(b){ b.disabled = false; });
}
document.getElementById("bPdf").addEventListener("click", exportPdf);

/* ====================== nuvem (Supabase) ======================
   Preencha SB_URL e SB_KEY (chave "anon/publishable"). Sem isso, o checklist
   continua funcionando só com localStorage. */
var SB_URL = "COLE_AQUI_A_URL_DO_PROJETO", SB_KEY = "COLE_AQUI_A_CHAVE_PUBLICA";
var sb = null, cloudUser = null, cloudReady = false, pushT = null;
var bLogin = document.getElementById("bLogin");
if(window.supabase && SB_URL.indexOf("http")===0){
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  bLogin.style.display = "";
  sb.auth.onAuthStateChange(function(ev, session){
    cloudUser = session ? session.user : null;
    bLogin.textContent = cloudUser ? "Sair ("+cloudUser.email+")" : "Entrar (salvar na nuvem)";
    if(cloudUser && !cloudReady) cloudLoad(); else if(!cloudUser) cloudReady = false;
  });
  bLogin.addEventListener("click", async function(){
    if(cloudUser){ await sb.auth.signOut(); say("Você saiu. Os dados continuam salvos na sua conta."); return; }
    var email = (window.prompt("Seu e-mail (enviaremos um link de acesso):")||"").trim();
    if(!email) return;
    var r = await sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo: location.href.split("#")[0] } });
    say(r.error ? "Erro: "+r.error.message : "Enviei um link para "+email+". Abra-o neste aparelho.");
  });
}
async function cloudLoad(){
  try{
    var r = await sb.from("checklists").select("dados").eq("user_id", cloudUser.id).maybeSingle();
    if(r.error) throw r.error;
    if(r.data && r.data.dados && r.data.dados.n && r.data.dados.c){
      S = Object.assign(fresh(), migrate(r.data.dados)); ensurePages();
      try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){}
      renderAll(); say("Checklist carregado da nuvem.");
      cloudReady = true;
    } else { cloudReady = true; cloudPush(); say("Checklist salvo na nuvem."); }
  }catch(e){ say("Não consegui carregar da nuvem: "+(e.message||e)); }
}
function cloudPush(){
  if(!sb || !cloudUser || !cloudReady) return;
  clearTimeout(pushT);
  pushT = setTimeout(async function(){
    var r = await sb.from("checklists").upsert({ user_id:cloudUser.id, dados:S, updated_at:new Date().toISOString() });
    if(r.error) say("Falha ao salvar na nuvem: "+r.error.message);
  }, 1000);
}
window.__test = { buildPdf:buildPdf, buildDocXml:buildDocXml, sigModel:sigModel, getS:function(){return S;} };
})();
